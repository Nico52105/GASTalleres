<style type="text/css">
  /* ===================================================
   Casa Chevrolet & Mazda - Tienda Virtual
   Chevrolet: dorado  #D4960A
   Mazda:     rojo    #C40B20
   E-commerce moderno, limpio y funcional
   =================================================== */
  :root {
    --bg: #f4f5f7;
    --bg-soft: #eef0f3;
    --paper: #ffffff;
    --ink: #1a1e26;
    --ink-soft: #4a5568;
    --muted: #8a96a8;
    --chev: #D4960A;
    --chev-d: #b8820a;
    --chev-light: #fdf3d8;
    --chev-glow: rgba(212, 150, 10, 0.14);
    --mazda: #C40B20;
    --mazda-d: #a30919;
    --mazda-light: #fde8eb;
    --mazda-glow: rgba(196, 11, 32, 0.10);
    --line: #e2e6ec;
    --shadow-sm: 0 2px 8px rgba(26, 30, 38, 0.07);
    --shadow: 0 8px 28px rgba(26, 30, 38, 0.10);
    --shadow-lg: 0 20px 50px rgba(26, 30, 38, 0.12);
    --radius: 14px;
    --transition: 0.22s ease;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: "Manrope", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    text-decoration: none;
  }

  /* TOPBAR */
  .topbar {
    background: var(--ink);
    color: #c8d4e6;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    padding: 7px 16px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .topbar-sep {
    opacity: 0.35;
  }

  /* HEADER */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }

  .nav {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand {
    font-family: "Rajdhani", sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .brand-chev {
    color: var(--chev);
  }

  .brand-sep {
    color: #c0c8d4;
    font-weight: 400;
  }

  .brand-mazda {
    color: var(--mazda);
  }

  .brand-sub {
    color: var(--muted);
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    align-self: flex-end;
    margin-bottom: 2px;
  }

  .search-bar {
    flex: 1;
    display: flex;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-soft);
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .search-bar:focus-within {
    border-color: var(--chev);
    box-shadow: 0 0 0 3px var(--chev-glow);
  }

  .search-bar input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 14px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }

  .search-bar input::placeholder {
    color: var(--muted);
  }

  .search-btn {
    background: var(--chev);
    border: none;
    padding: 0 16px;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: background var(--transition);
  }

  .search-btn:hover {
    background: var(--chev-d);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .nav-links {
    display: flex;
    gap: 2px;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .nav-links a {
    display: block;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.88rem;
    padding: 6px 12px;
    border-radius: 8px;
    transition: background var(--transition), color var(--transition);
  }

  .nav-links a:hover {
    background: var(--chev-light);
    color: var(--chev);
  }

  .cart-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--transition);
  }

  .cart-btn:hover {
    background: #2d3748;
  }

  .cart-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--mazda);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 800;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    transition: transform 0.2s;
  }

  .cart-badge.bump {
    transform: scale(1.4);
  }

  /* CARRITO LATERAL */
  .cart-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 200;
  }

  .cart-overlay.open {
    display: block;
  }

  .cart-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 100%;
    max-width: 420px;
    height: 100%;
    background: var(--paper);
    z-index: 201;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .cart-panel.open {
    right: 0;
  }

  .cart-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
  }

  .cart-panel-header h3 {
    font-family: "Rajdhani", sans-serif;
    margin: 0;
    font-size: 1.3rem;
  }

  .cart-close {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 6px;
    transition: background var(--transition);
  }

  .cart-close:hover {
    background: var(--bg-soft);
    color: var(--ink);
  }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
  }

  .cart-empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 0.95rem;
  }

  .cart-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .ci-icon {
    width: 52px;
    height: 52px;
    background: var(--bg-soft);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }

  .ci-info {
    flex: 1;
  }

  .ci-name {
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 2px;
  }

  .ci-ref {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .ci-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .ci-price {
    font-weight: 800;
    font-size: 1rem;
    color: var(--ink);
  }

  .ci-qty {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ci-qty button {
    width: 26px;
    height: 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg-soft);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition);
  }

  .ci-qty button:hover {
    background: var(--chev-light);
  }

  .ci-qty span {
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }

  .ci-remove {
    background: none;
    border: none;
    color: var(--mazda);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background var(--transition);
  }

  .ci-remove:hover {
    background: var(--mazda-light);
  }

  .cart-footer {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cart-footer[hidden] {
    display: none;
  }

  .cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 1rem;
    padding: 8px 0;
  }

  .cart-total strong {
    font-size: 1.35rem;
    color: var(--ink);
  }

  .full-w {
    width: 100%;
    justify-content: center;
  }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 700;
    border: 1.5px solid transparent;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
  }

  .btn.large {
    padding: 13px 26px;
    font-size: 0.97rem;
  }

  .btn.primary {
    background: var(--chev);
    color: #fff;
    box-shadow: 0 4px 14px rgba(212, 150, 10, 0.32);
  }

  .btn.primary:hover {
    background: var(--chev-d);
    box-shadow: 0 6px 20px rgba(212, 150, 10, 0.45);
  }

  .btn.ghost {
    border-color: var(--line);
    color: var(--ink-soft);
    background: var(--bg-soft);
  }

  .btn.ghost:hover {
    background: var(--chev-light);
    border-color: rgba(212, 150, 10, 0.4);
    color: #8a6200;
  }

  .btn.ghost-dark {
    border-color: rgba(255, 255, 255, 0.2);
    color: #c8d4e6;
    background: rgba(255, 255, 255, 0.07);
  }

  .btn.ghost-dark:hover {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.35);
    color: #fff;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* HERO */
  .hero {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }

  .hero-content h1 {
    font-family: "Rajdhani", sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    line-height: 1.1;
    margin: 0 0 16px;
    color: var(--ink);
  }

  .highlight-chev {
    color: var(--chev);
  }

  .hero-content p {
    color: var(--ink-soft);
    font-size: 1.05rem;
    margin: 0 0 28px;
    max-width: 52ch;
  }

  .hero-cta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .trust-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .trust-item {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .hero-visual {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  .hero-card-chev,
  .hero-card-mazda {
    border-radius: 18px;
    padding: 24px 28px;
    position: relative;
  }

  .hero-card-chev {
    background: linear-gradient(135deg, #fffbe8, var(--chev-light));
    border: 1.5px solid rgba(212, 150, 10, 0.3);
  }

  .hero-card-mazda {
    background: linear-gradient(135deg, #fff5f6, var(--mazda-light));
    border: 1.5px solid rgba(196, 11, 32, 0.2);
  }

  .hc-label {
    font-family: "Rajdhani", sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .hero-card-chev .hc-label {
    color: #8a6200;
  }

  .hero-card-mazda .hc-label {
    color: var(--mazda);
  }

  .hc-models {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .hc-cat {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .hero-promo-tag {
    position: absolute;
    top: -14px;
    right: 20px;
    background: var(--mazda);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(196, 11, 32, 0.3);
  }

  .dual-badge {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .badge.chev {
    background: var(--chev-light);
    color: #8a6200;
    border: 1px solid rgba(212, 150, 10, 0.3);
  }

  .badge.mazda {
    background: var(--mazda-light);
    color: var(--mazda);
    border: 1px solid rgba(196, 11, 32, 0.25);
  }

  /* SECTIONS */
  .section {
    max-width: 1280px;
    margin: 56px auto;
    padding: 0 24px;
  }

  .section-header {
    margin-bottom: 28px;
  }

  .section-header h2 {
    font-family: "Rajdhani", sans-serif;
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    margin: 0 0 6px;
    color: var(--ink);
  }

  .section-header p {
    margin: 0;
    color: var(--ink-soft);
  }

  .kicker {
    display: inline-block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--chev);
    font-weight: 800;
    margin-bottom: 8px;
  }

  h1,
  h2,
  h3,
  h4 {
    font-family: "Rajdhani", sans-serif;
    line-height: 1.15;
    margin-top: 0;
    color: var(--ink);
  }

  /* CATEGORIAS */
  .cat-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .cat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 20px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--ink-soft);
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
  }

  .cat-card:hover {
    border-color: var(--chev);
    color: var(--chev);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--chev-glow);
  }

  .cat-card.active {
    background: var(--chev);
    border-color: var(--chev);
    color: #fff;
    box-shadow: 0 6px 20px rgba(212, 150, 10, 0.35);
  }

  .cat-icon {
    font-size: 1.5rem;
  }

  /* SHOP LAYOUT */
  .shop-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 28px;
    align-items: start;
  }

  .sidebar {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 90px;
  }

  .filter-group {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .filter-group:last-of-type {
    border-bottom: none;
    margin-bottom: 12px;
  }

  .filter-group h4 {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .filter-check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    cursor: pointer;
    font-weight: 500;
  }

  .filter-check input {
    cursor: pointer;
    accent-color: var(--chev);
  }

  .filter-check:hover {
    color: var(--ink);
  }

  .products-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 14px;
  }

  .products-bar span {
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 600;
  }

  .products-bar select {
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.88rem;
    font-family: inherit;
    color: var(--ink-soft);
    background: var(--paper);
    cursor: pointer;
    outline: none;
  }

  .products-bar select:focus {
    border-color: var(--chev);
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  /* TARJETA PRODUCTO */
  .product-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    display: flex;
    flex-direction: column;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: rgba(212, 150, 10, 0.3);
  }

  .product-card.mazda-card:hover {
    border-color: rgba(196, 11, 32, 0.3);
  }

  .pc-image {
    background: var(--bg-soft);
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    position: relative;
  }

  .pc-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 3px 8px;
    border-radius: 5px;
  }

  .pc-badge.chev {
    background: var(--chev-light);
    color: #8a6200;
    border: 1px solid rgba(212, 150, 10, 0.25);
  }

  .pc-badge.mazda {
    background: var(--mazda-light);
    color: var(--mazda);
    border: 1px solid rgba(196, 11, 32, 0.2);
  }

  .pc-badge.ambas {
    background: #f0f4ff;
    color: #4a5568;
    border: 1px solid #bec8dc;
  }

  .pc-tag-orig {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }

  .pc-tag-alt {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #90caf9;
  }

  .pc-body {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .pc-ref {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .pc-name {
    font-family: "Rajdhani", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .pc-compat {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 12px;
    flex: 1;
  }

  .pc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: auto;
  }

  .pc-price {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--ink);
  }

  .pc-price-old {
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: line-through;
    display: block;
    line-height: 1;
  }

  .pc-add {
    background: var(--chev);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.84rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background var(--transition), transform 0.15s;
    white-space: nowrap;
  }

  .pc-add:hover {
    background: var(--chev-d);
    transform: scale(1.04);
  }

  .pc-add.mazda-add {
    background: var(--mazda);
  }

  .pc-add.mazda-add:hover {
    background: var(--mazda-d);
  }

  .pc-detail {
    font-size: 0.78rem;
    color: var(--chev);
    font-weight: 700;
    cursor: pointer;
