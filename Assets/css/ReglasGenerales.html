<style>
:root {
    --bg: #f4f5f7;
    --bg-soft: #eef0f3;
    --paper: #ffffff;
    --ink: #1a1e26;
    --ink-soft: #4a5568;
    --muted: #8a96a8;
    --chev: #D4960A;
    --chev-d: #b8820a;
    --chev-light: #fdf3d8;
    --chev-glow: rgba(212, 150, 10, 0.14);
    --mazda: #C40B20;
    --mazda-d: #a30919;
    --mazda-light: #fde8eb;
    --mazda-glow: rgba(196, 11, 32, 0.10);
    --line: #e2e6ec;
    --shadow-sm: 0 2px 8px rgba(26, 30, 38, 0.07);
    --shadow: 0 8px 28px rgba(26, 30, 38, 0.10);
    --shadow-lg: 0 20px 50px rgba(26, 30, 38, 0.12);
    --radius: 14px;
    --transition: 0.22s ease;
}

body, html {
    height: 100%;
    width: 100%;
}

.brand-chev {
    color: var(--chev);
}

.brand-sep {
    color: #c0c8d4;
    font-weight: 400;
}

.brand-mazda {
    color: var(--mazda);
}

/* ──────────────────────────────────────────
   Carrito – Drawer lateral animado
   ────────────────────────────────────────── */
@keyframes carrito-overlay-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@keyframes carrito-slide-in {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
}

@keyframes carrito-slide-out {
    from { transform: translateX(0); }
    to   { transform: translateX(100%); }
}

.carrito-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    z-index: 1050;
    animation: carrito-overlay-in 0.25s ease forwards;
}

.carrito-overlay--visible {
    display: block;
}

.carrito-panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 380px;
    max-width: 100vw;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 32px rgba(26, 30, 38, 0.18);
    transform: translateX(100%);
}

.carrito-panel--entrando {
    animation: carrito-slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.carrito-panel--saliendo {
    animation: carrito-slide-out 0.28s cubic-bezier(0.55, 0, 0.45, 1) forwards;
}

/* Cabecera */
.carrito-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
    flex-shrink: 0;
}

.carrito-close-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
}

.carrito-close-btn:hover {
    background: var(--line);
    color: var(--ink);
}

/* Cuerpo */
.carrito-body {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
}

.carritoItems {
    border-radius: 0;
}

.carrito-item {
    border-left: none;
    border-right: none;
    padding: 0.85rem 1.25rem;
    transition: background var(--transition);
}

.carrito-item:hover {
    background: var(--bg-soft);
}

.carrito-item-nombre {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink);
}

.carrito-item-precio {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
}

.carrito-item-remove {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
    flex-shrink: 0;
}

.carrito-item-remove:hover {
    background: var(--mazda-light);
    color: var(--mazda);
}

/* Estado vacío */
.carrito-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 220px;
    padding: 2rem;
    color: var(--muted);
}

/* Pie */
.carrito-footer {
    padding: 1.1rem 1.25rem;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    background: var(--paper);
}

.carrito-subtotal,
.carrito-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    color: var(--ink);
}

.carrito-subtotal {
    font-size: 0.85rem;
    color: var(--ink-soft);
}

.carrito-btn-compra {
    background: var(--chev);
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    padding: 0.7rem;
    transition: background var(--transition), box-shadow var(--transition);
}

.carrito-btn-compra:hover {
    background: var(--chev-d);
    box-shadow: 0 4px 16px var(--chev-glow);
    color: #fff;
}
</style>
