<script> 
﻿// Nota: los atributos deben estar en minusculas para que sean detectados por el navegador.
(function () {
    const etiquetaFiltroComponent = 'filtro-component';
    if (customElements.get(etiquetaFiltroComponent)) return;

    let _contador = 0;

    class FiltroComponent extends HTMLElement {

        constructor() {
            super();
            this._id = `filtro-${++_contador}`;
            this._datos = {};
            this._seleccion = {};
        }

        /* -- Datos por defecto ----------------------------------------- */
        _datosDefault() {
            return {
                "SinFiltros": {
                    "Orden": 0,
                    "titulo": "No hay filtros disponibles",
                    "control": "checkbox",
                    "opciones": []
                }
            };
        }

        /* -- Helpers ---------------------------------------------------- */
        _claveSegura(texto) {
            return texto.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9\-]/g, '');
        }

        /* -- Render de un grupo de filtros ------------------------------ */
        _renderGrupo(clave, grupo) {
            const collapseId = `${this._id}-${clave}`;
            const tipo       = grupo.control === 'radio' ? 'radio' : 'checkbox';
            const name       = tipo === 'radio' ? collapseId : null;

            const controles = grupo.opciones.map((op, i) => {
                const inputId  = `${collapseId}-op${i}`;
                const value    = this._claveSegura(op);
                const sel      = (this._seleccion[clave] || []).includes(value);
                const nameAttr = name ? `name="${name}"` : '';
                return `
                    <div class="form-check mb-1">
                        <input  class="form-check-input filtro-input"
                                type="${tipo}"
                                id="${inputId}"
                                ${nameAttr}
                                value="${value}"
                                data-grupo="${clave}"
                                ${sel ? 'checked' : ''}>
                        <label class="form-check-label" for="${inputId}">${op}</label>
                    </div>`;
            }).join('');

            return `
                <div class="filtro-grupo" data-grupo="${clave}">
                    <button class="filtro-grupo-btn"
                            data-bs-toggle="collapse"
                            data-bs-target="#${collapseId}"
                            aria-expanded="true"
                            aria-controls="${collapseId}">
                        <span>${grupo.titulo}</span>
                        <svg class="filtro-chevron" xmlns="http://www.w3.org/2000/svg"
                             width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                  d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                        </svg>
                    </button>
                    <div class="collapse show" id="${collapseId}">
                        <div class="filtro-opciones">${controles}</div>
                    </div>
                </div>`;
        }

        /* -- Template completo ------------------------------------------ */
        getTemplate() {
            const template = document.createElement('template');

            const grupos = Object.entries(this._datos)
                .sort(([, a], [, b]) => (a.Orden ?? 0) - (b.Orden ?? 0))
                .map(([clave, grupo]) => this._renderGrupo(clave, grupo))
                .join('<div class="filtro-sep"></div>');

            template.innerHTML = `
                <style>
                    /* -- Wrapper principal -- */
                    .filtro-wrap {
                        background    : var(--paper, #ffffff);
                        border-radius : var(--radius, 14px);
                        box-shadow    : var(--shadow-sm, 0 2px 8px rgba(26,30,38,.07));
                        display       : flex;
                        flex-direction: column;
                        height        : 100%;
                        overflow      : hidden;
                    }

                    /* -- Botón toggle móvil -- */
                    .filtro-toggle-movil {
                        display        : none;
                        width          : 100%;
                        background     : none;
                        border         : none;
                        align-items    : center;
                        justify-content: space-between;
                        padding        : 12px 16px;
                        cursor         : pointer;
                        flex-shrink    : 0;
                    }
                    .filtro-chevron-movil {
                        transition : transform .22s ease;
                        flex-shrink: 0;
                    }
                    .filtro-toggle-movil[aria-expanded="true"] .filtro-chevron-movil {
                        transform: rotate(180deg);
                    }

                    /* -- Footer móvil -- */
                    .filtro-footer-movil {
                        display        : none;
                        padding        : 10px 16px;
                        border-top     : 1px solid var(--line, #e2e6ec);
                        justify-content: flex-end;
                    }

                    /* -- Encabezado -- */
                    .filtro-header {
                        display        : flex;
                        align-items    : center;
                        justify-content: space-between;
                        padding        : 14px 16px 12px;
                        border-bottom  : 1px solid var(--line, #e2e6ec);
                        flex-shrink    : 0;
                    }
                    .filtro-titulo {
                        display    : flex;
                        align-items: center;
                        gap        : 7px;
                        font-size  : 0.92rem;
                        font-weight: 700;
                        color      : var(--ink, #1a1e26);
                    }
                    .filtro-titulo svg { color: var(--chev, #D4960A); }

                    .filtro-limpiar {
                        background   : none;
                        border       : 1px solid var(--line, #e2e6ec);
                        font-size    : 0.75rem;
                        font-weight  : 600;
                        color        : var(--ink-soft, #4a5568);
                        cursor       : pointer;
                        padding      : 3px 10px;
                        border-radius: 20px;
                        transition   : background .18s, color .18s, border-color .18s;
                    }
                    .filtro-limpiar:hover {
                        background  : var(--chev-light, #fdf3d8);
                        color       : var(--chev-d, #b8820a);
                        border-color: var(--chev, #D4960A);
                    }

                    /* -- Cuerpo con scroll -- */
                    .filtro-cuerpo {
                        flex           : 1 1 0;
                        min-height     : 0;
                        overflow-y     : auto;
                        padding        : 6px 0 12px;
                        scrollbar-width: thin;
                        scrollbar-color: var(--line, #e2e6ec) transparent;
                    }
                    .filtro-cuerpo::-webkit-scrollbar        { width: 5px; }
                    .filtro-cuerpo::-webkit-scrollbar-track  { background: transparent; }
                    .filtro-cuerpo::-webkit-scrollbar-thumb  {
                        background   : var(--line, #e2e6ec);
                        border-radius: 10px;
                    }
                    .filtro-cuerpo::-webkit-scrollbar-thumb:hover {
                        background: var(--muted, #8a96a8);
                    }

                    /* -- Separador -- */
                    .filtro-sep {
                        height    : 1px;
                        background: var(--line, #e2e6ec);
                        margin    : 2px 14px;
                    }

                    /* -- Boton de grupo -- */
                    .filtro-grupo-btn {
                        width          : 100%;
                        background     : none;
                        border         : none;
                        display        : flex;
                        align-items    : center;
                        justify-content: space-between;
                        padding        : 10px 16px;
                        font-size      : 0.8rem;
                        font-weight    : 700;
                        color          : var(--ink, #1a1e26);
                        text-transform : uppercase;
                        letter-spacing : 0.055em;
                        cursor         : pointer;
                        transition     : background .18s;
                        text-align     : left;
                    }
                    .filtro-grupo-btn:hover { background: var(--bg-soft, #eef0f3); }

                    /* Chevron gira al abrir/cerrar */
                    .filtro-chevron { transition: transform .22s ease; flex-shrink: 0; }
                    .filtro-grupo-btn[aria-expanded="false"] .filtro-chevron {
                        transform: rotate(-90deg);
                    }

                    /* -- Opciones -- */
                    .filtro-opciones { padding: 2px 16px 8px 20px; }

                    .form-check-label {
                        font-size: 0.875rem;
                        color    : var(--ink-soft, #4a5568);
                        cursor   : pointer;
                    }
                    .form-check-input:checked {
                        background-color: var(--chev, #D4960A);
                        border-color    : var(--chev, #D4960A);
                    }
                    .form-check-input:focus {
                        border-color: var(--chev, #D4960A);
                        box-shadow  : 0 0 0 .2rem var(--chev-glow, rgba(212,150,10,.14));
                    }

                    /* -- Móvil (< 768px): barra desplegable inline -- */
                    @media (max-width: 767.98px) {
                        .filtro-wrap {
                            height  : auto;
                            overflow: visible;
                        }
                        .filtro-header { display: none; }

                        /* Barra toggle: ancho completo del padre */
                        .filtro-toggle-movil {
                            display: flex;
                            width  : 100%;
                        }

                        /* Panel que cae hacia abajo como cortina */
                        .filtro-cuerpo {
                            flex          : none;
                            max-height    : calc(100vh - 95px);
                            overflow-y    : auto;
                            display       : none;
                            border-top    : 1px solid var(--line, #e2e6ec);
                            padding-bottom: 0;
                        }
                        .filtro-cuerpo.filtro-abierto { display: block; }

                        /* Footer limpiar (flujo normal) */
                        .filtro-footer-movil {
                            position: static;
                        }
                        .filtro-footer-movil.filtro-abierto { display: flex; }
                    }
                </style>

                <div class="filtro-wrap">

                    <!-- Botón toggle (solo móvil) -->
                    <button class="filtro-toggle-movil"
                            aria-expanded="false"
                            aria-controls="${this._id}-cuerpo">
                        <span class="filtro-titulo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" viewBox="0 0 16 16">
                                <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
                            </svg>
                            Filtros
                        </span>
                        <svg class="filtro-chevron-movil" xmlns="http://www.w3.org/2000/svg"
                             width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                  d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                        </svg>
                    </button>

                    <!-- Encabezado (solo desktop) -->
                    <div class="filtro-header">
                        <span class="filtro-titulo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                 fill="currentColor" viewBox="0 0 16 16">
                                <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
                            </svg>
                            Filtros
                        </span>
                        <button class="filtro-limpiar" title="Limpiar todos los filtros">
                            Limpiar todo
                        </button>
                    </div>

                    <!-- Grupos de filtros (compartido desktop y móvil) -->
                    <div class="filtro-cuerpo" id="${this._id}-cuerpo">
                        ${grupos}
                    </div>

                    <!-- Footer móvil con botón limpiar -->
                    <div class="filtro-footer-movil">
                        <button class="filtro-limpiar" title="Limpiar todos los filtros">
                            Limpiar todo
                        </button>
                    </div>

                </div>
            `;
            return template;
        }

        /* -- Render y eventos ------------------------------------------- */
        render() {
            const template = this.getTemplate();
            this.innerHTML = '';
            this.appendChild(template.content.cloneNode(true));
            this._bindEvents();
        }

        _bindEvents() {
            /* Limpiar seleccion (desktop y móvil) */
            this.querySelectorAll('.filtro-limpiar').forEach(btn => {
                btn.addEventListener('click', () => {
                    this._seleccion = {};
                    this.querySelectorAll('.filtro-input').forEach(inp => { inp.checked = false; });
                    this._emitirCambio();
                });
            });

            /* Toggle móvil */
            const toggleMovil = this.querySelector('.filtro-toggle-movil');
            const cuerpo      = this.querySelector('.filtro-cuerpo');
            const footerMovil = this.querySelector('.filtro-footer-movil');

            toggleMovil?.addEventListener('click', () => {
                const abierto = toggleMovil.getAttribute('aria-expanded') === 'true';
                toggleMovil.setAttribute('aria-expanded', String(!abierto));
                cuerpo?.classList.toggle('filtro-abierto', !abierto);
                footerMovil?.classList.toggle('filtro-abierto', !abierto);
            });

            /* Cambio de inputs */
            this.querySelectorAll('.filtro-input').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    const grupo = e.target.dataset.grupo;
                    const tipo  = this._datos[grupo]?.control;
                    const valor = e.target.value;

                    if (tipo === 'radio') {
                        this._seleccion[grupo] = e.target.checked ? [valor] : [];
                    } else {
                        if (!Array.isArray(this._seleccion[grupo])) this._seleccion[grupo] = [];
                        if (e.target.checked) {
                            this._seleccion[grupo].push(valor);
                        } else {
                            this._seleccion[grupo] = this._seleccion[grupo].filter(v => v !== valor);
                        }
                    }
                    this._emitirCambio();
                });
            });

            /* Sincronizar aria-expanded con Bootstrap collapse */
            this.querySelectorAll('[data-bs-toggle="collapse"]').forEach(btn => {
                const targetId = btn.getAttribute('data-bs-target')?.slice(1);
                const panel    = targetId ? this.querySelector(`#${targetId}`) : null;
                if (!panel) return;
                panel.addEventListener('show.bs.collapse',  () => btn.setAttribute('aria-expanded', 'true'));
                panel.addEventListener('hide.bs.collapse',  () => btn.setAttribute('aria-expanded', 'false'));
            });
        }

        _emitirCambio() {
            this.dispatchEvent(new CustomEvent('filtro-cambio', {
                detail  : { seleccion: this.getSeleccion() },
                bubbles : true,
                composed: true
            }));
        }

        /* -- API publica ------------------------------------------------ */

        /** Retorna la seleccion actual como objeto plano. */
        getSeleccion() {
            return JSON.parse(JSON.stringify(this._seleccion));
        }

        /**
         * Reemplaza todos los datos del filtro y re-renderiza.
         * @param {Object} datos  { clave: { titulo, control, opciones[] } }
         */
        setDatos(datos) {
            this._datos     = datos;
            this._seleccion = {};
            this.render();
        }

        /**
         * Cambia dinamicamente el tipo de control de un grupo y re-renderiza.
         * @param {string}             grupo  Clave del grupo
         * @param {'checkbox'|'radio'} tipo   Tipo de control deseado
         */
        setCriterio(grupo, tipo) {
            if (!this._datos[grupo]) return;
            this._datos[grupo].control = tipo;
            delete this._seleccion[grupo];
            this.render();
        }

        /* -- Ciclo de vida ---------------------------------------------- */
        connectedCallback() {
            this.style.display = 'contents';

            if (Object.keys(this._datos).length === 0) {
                try {
                    const json = this.textContent.trim();
                    this._datos = json ? JSON.parse(json) : this._datosDefault();
                } catch (e) {
                    console.error('FiltroComponent: error al parsear JSON', e);
                    this._datos = this._datosDefault();
                }
            }

            this.render();
        }
    }

    customElements.define(etiquetaFiltroComponent, FiltroComponent);
})();</script>
