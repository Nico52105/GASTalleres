<script>
    // Nota: los atributos deben estar en minúsculas para que sean detectados por el navegador.
    let EtiquetaCarritoComponent = 'carrito-component';
    class CarritoComponent extends HTMLElement {
    
        constructor() {
            super();
            this._items = [];
        }
    
        getTemplate() {
            const template = document.createElement('template');
    
            template.innerHTML = `
                <div class="carrito-overlay">
                    <div class="carrito-panel">
    
                        <div class="carrito-header">
                            <div class="d-flex align-items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                                </svg>
                                <span>Carrito de Compras</span>
                            </div>
                            <button class="carrito-close-btn" aria-label="Cerrar carrito">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                </svg>
                            </button>
                        </div>
    
                        <div class="carrito-body">
                            <ul class="carritoItems list-group list-group-flush">
                                <!-- Items agregados dinámicamente -->
                            </ul>
                            <div class="carrito-empty">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="mb-3 text-muted" viewBox="0 0 16 16">
                                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102z"/>
                                </svg>
                                <p class="text-muted mb-0">Tu carrito está vacío</p>
                            </div>
                        </div>
    
                        <div class="carrito-footer">
                            <div class="carrito-subtotal">
                                <span class="text-muted">Subtotal</span>
                                <span class="carrito-subtotal-valor">$0.00</span>
                            </div>
                            <hr class="my-2">
                            <div class="carrito-total">
                                <span>Total</span>
                                <span class="carrito-total-valor fw-bold">$0.00</span>
                            </div>
                            <button class="carrito-btn-compra btn w-100 mt-3">
                                Finalizar Compra
                            </button>
                        </div>
    
                    </div>
                </div>
            `;
            return template;
        }
    
        render() {
            const template = this.getTemplate();
            this.innerHTML = '';
            this.appendChild(template.content.cloneNode(true));
            this._bindEvents();
            this._actualizarVista();
        }
    
        _bindEvents() {
            const overlay = this.querySelector('.carrito-overlay');
            const closeBtn = this.querySelector('.carrito-close-btn');
            const panel = this.querySelector('.carrito-panel');
    
            closeBtn?.addEventListener('click', () => this.cerrar());
    
            // Cerrar al hacer clic en el overlay (fuera del panel)
            overlay?.addEventListener('click', (e) => {
                if (!panel.contains(e.target)) this.cerrar();
            });
        }
    
        abrir() {
            const overlay = this.querySelector('.carrito-overlay');
            const panel = this.querySelector('.carrito-panel');
            if (!overlay) return;
            overlay.classList.add('carrito-overlay--visible');
            panel.classList.remove('carrito-panel--saliendo');
            panel.classList.add('carrito-panel--entrando');
        }
    
        cerrar() {
            const overlay = this.querySelector('.carrito-overlay');
            const panel = this.querySelector('.carrito-panel');
            if (!overlay) return;
            panel.classList.remove('carrito-panel--entrando');
            panel.classList.add('carrito-panel--saliendo');
            panel.addEventListener('animationend', () => {
                overlay.classList.remove('carrito-overlay--visible');
                panel.classList.remove('carrito-panel--saliendo');
            }, { once: true });
        }
    
        agregarItem(item) {
            const existente = this._items.find(i => i.id === item.id);
            if (existente) {
                existente.cantidad = (existente.cantidad || 1) + 1;
            } else {
                this._items.push({ ...item, cantidad: 1 });
            }
            this._actualizarVista();
        }
    
        quitarItem(id) {
            this._items = this._items.filter(i => i.id !== id);
            this._actualizarVista();
        }
    
        _actualizarVista() {
            const lista = this.querySelector('.carritoItems');
            const empty = this.querySelector('.carrito-empty');
            const subtotalEl = this.querySelector('.carrito-subtotal-valor');
            const totalEl = this.querySelector('.carrito-total-valor');
            if (!lista) return;
    
            lista.innerHTML = '';
    
            if (this._items.length === 0) {
                lista.style.display = 'none';
                empty.style.display = 'flex';
            } else {
                lista.style.display = '';
                empty.style.display = 'none';
                this._items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'carrito-item list-group-item';
                    li.innerHTML = `
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <div class="carrito-item-info">
                                <p class="carrito-item-nombre mb-0">${item.nombre}</p>
                                <small class="text-muted">x${item.cantidad}</small>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="carrito-item-precio">$${(item.precio * item.cantidad).toFixed(2)}</span>
                                <button class="carrito-item-remove" data-id="${item.id}" aria-label="Quitar">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    li.querySelector('.carrito-item-remove')
                        .addEventListener('click', () => this.quitarItem(item.id));
                    lista.appendChild(li);
                });
            }
    
            const total = this._items.reduce((s, i) => s + i.precio * i.cantidad, 0);
            if (subtotalEl) subtotalEl.textContent = `$${total.toFixed(2)}`;
            if (totalEl) totalEl.textContent = `$${total.toFixed(2)}`;
        }
    
        connectedCallback() {
            this.render();
        }
    
    }
    customElements.define(EtiquetaCarritoComponent, CarritoComponent);
</script>
