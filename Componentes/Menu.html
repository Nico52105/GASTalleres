<script> 
// Nota: los atributos deben estar en minúsculas para que sean detectados por el navegador.
(function () {
    const etiquetaMenuComponent = 'menu-component';
    if (customElements.get(etiquetaMenuComponent)) return;

    let _contador = 0;

    class MenuComponent extends HTMLElement {

        constructor() {
            super();
            this._menuId = `menu-panel-${++_contador}`;
            this._abierto = false;
            this._cerrarFuera = null;
        }

        getTemplate() {
            const template = document.createElement('template');
            let datos = [];
            try {
                datos = JSON.parse(this.textContent.trim() || '[]');
            } catch (e) {
                console.error('MenuComponent: error al parsear JSON', e);
            }

            this._linksMobileHtml = datos.map(op =>
                `<li role="none">
                    <a class="menu-mobile-link" href="#" role="menuitem"
                       onclick="ObtenerPagina('${op.pagina}');return false;">${op.titulo}</a>
                </li>`
            ).join('');

            const linksEscritorio = datos.map(op =>
                `<li role="none">
                    <a class="menu-link" href="#" role="menuitem"
                       onclick="ObtenerPagina('${op.pagina}');return false;">${op.titulo}</a>
                </li>`
            ).join('');

            template.innerHTML = `
                <style>
                    .menu-toggle {
                        display: none;
                        align-items: center;
                        justify-content: center;
                        background: none;
                        border: 1.5px solid rgba(26, 30, 38, 0.2);
                        border-radius: 8px;
                        padding: 6px 10px;
                        cursor: pointer;
                        color: var(--ink, #1a1e26);
                        font-size: 1.2rem;
                        line-height: 1;
                        transition: background 0.18s;
                    }
                    .menu-toggle:hover { background: var(--bg-soft, #eef0f3); }

                    .menu-desktop {
                        display: flex;
                        list-style: none;
                        margin: 0;
                        padding: 0;
                        gap: 2px;
                        align-items: center;
                    }
                    .menu-link {
                        display: block;
                        padding: 6px 12px;
                        border-radius: 8px;
                        font-size: 0.88rem;
                        font-weight: 600;
                        color: var(--ink-soft, #4a5568);
                        text-decoration: none;
                        white-space: nowrap;
                        transition: background 0.18s, color 0.18s;
                    }
                    .menu-link:hover {
                        background: var(--bg-soft, #eef0f3);
                        color: var(--ink, #1a1e26);
                    }

                    /* ── Modal móvil ── */
                    @keyframes menu-overlay-in {
                        from { opacity: 0; }
                        to   { opacity: 1; }
                    }
                    @keyframes menu-card-in {
                        from { opacity: 0; transform: scale(0.92) translateY(-16px); }
                        to   { opacity: 1; transform: scale(1)    translateY(0); }
                    }
                    .menu-modal-overlay {
                        display: none;
                        position: fixed;
                        inset: 0;
                        z-index: 2000;
                        background: rgba(26, 30, 38, 0.55);
                        -webkit-backdrop-filter: blur(4px);
                        backdrop-filter: blur(4px);
                        align-items: center;
                        justify-content: center;
                        animation: menu-overlay-in 0.2s ease forwards;
                    }
                    .menu-modal-overlay.abierto { display: flex; }
                    .menu-modal-card {
                        background: var(--paper, #fff);
                        border-radius: 18px;
                        box-shadow: 0 24px 56px rgba(26, 30, 38, 0.22);
                        padding: 24px 20px 20px;
                        width: 88%;
                        max-width: 340px;
                        animation: menu-card-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
                    }
                    .menu-modal-header {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        margin-bottom: 14px;
                        padding-bottom: 12px;
                        border-bottom: 1px solid var(--line, #e2e6ec);
                    }
                    .menu-modal-title {
                        font-size: 1rem;
                        font-weight: 700;
                        color: var(--ink, #1a1e26);
                        letter-spacing: 0.02em;
                    }
                    .menu-modal-close {
                        background: none;
                        border: none;
                        cursor: pointer;
                        font-size: 1rem;
                        color: var(--muted, #8a96a8);
                        padding: 4px 8px;
                        border-radius: 6px;
                        line-height: 1;
                        transition: background 0.18s, color 0.18s;
                    }
                    .menu-modal-close:hover {
                        background: var(--bg-soft, #eef0f3);
                        color: var(--ink, #1a1e26);
                    }
                    .menu-modal-list {
                        list-style: none;
                        margin: 0;
                        padding: 0;
                        display: flex;
                        flex-direction: column;
                        gap: 2px;
                    }
                    .menu-mobile-link {
                        display: block;
                        padding: 12px 16px;
                        border-radius: 10px;
                        font-size: 0.95rem;
                        font-weight: 600;
                        color: var(--ink-soft, #4a5568);
                        text-decoration: none;
                        transition: background 0.18s, color 0.18s;
                    }
                    .menu-mobile-link:hover {
                        background: var(--bg-soft, #eef0f3);
                        color: var(--ink, #1a1e26);
                    }

                    @media (max-width: 991px) {
                        .menu-toggle  { display: inline-flex; }
                        .menu-desktop { display: none; }
                    }
                </style>

                <button class="menu-toggle"
                        aria-label="Abrir menú"
                        aria-expanded="false"
                        aria-haspopup="dialog">&#9776;</button>

                <ul class="menu-desktop" role="menubar">
                    ${linksEscritorio}
                </ul>
            `;
            return template;
        }

        _crearOverlay() {
            const overlay = document.createElement('div');
            overlay.className = 'menu-modal-overlay';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            overlay.setAttribute('aria-label', 'Menú de navegación');
            overlay.innerHTML = `
                <div class="menu-modal-card">
                    <div class="menu-modal-header">
                        <span class="menu-modal-title">Navegación</span>
                        <button class="menu-modal-close" aria-label="Cerrar menú">&#10005;</button>
                    </div>
                    <ul class="menu-modal-list" role="menu">
                        ${this._linksMobileHtml}
                    </ul>
                </div>
            `;
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) this._cerrar();
            });
            overlay.querySelector('.menu-modal-close').addEventListener('click', () => this._cerrar());
            this._overlay = overlay;
        }

        _abrir() {
            if (!this._overlay) this._crearOverlay();
            document.body.appendChild(this._overlay);
            // forzar reflow para que la animación arranque desde cero
            void this._overlay.offsetWidth;
            this._overlay.classList.add('abierto');
            this.querySelector('.menu-toggle').setAttribute('aria-expanded', 'true');
            this._abierto = true;
        }

        _cerrar() {
            if (!this._overlay) return;
            this._overlay.classList.remove('abierto');
            this._overlay.remove();
            this.querySelector('.menu-toggle')?.setAttribute('aria-expanded', 'false');
            this._abierto = false;
        }

        _activarToggle() {
            const btn = this.querySelector('.menu-toggle');
            if (!btn) return;

            btn.addEventListener('click', () => {
                this._abierto ? this._cerrar() : this._abrir();
            });
        }

        render() {
            const template = this.getTemplate();
            this.innerHTML = '';
            this.appendChild(template.content.cloneNode(true));
            this._activarToggle();
        }

        connectedCallback() {
            this.style.position = 'relative';
            this.render();
        }

        disconnectedCallback() {
            this._cerrar();
        }
    }

    customElements.define(etiquetaMenuComponent, MenuComponent);
})();</script>
